[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "count-significance"
version = "0.2.0"
description = "Accurate significance and p-values for count data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19,<2",
    "pytest>=8",
    "ruff>=0.16,<0.17",
]

[project.urls]
Repository = "https://github.com/EnzoCanonero/count-significance"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["count_significance", "count_significance.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.9"
files = ["src/count_significance"]
check_untyped_defs = true
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
