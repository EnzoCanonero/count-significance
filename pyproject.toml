[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "count-significance"
version = "0.2.0rc1"
description = "Accurate significance and p-values for count data"
readme = { file = "PYPI_README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Enzo Canonero", email = "Enzo.Canonero@rhul.ac.uk" },
    { name = "Glen Cowan", email = "G.Cowan@rhul.ac.uk" },
]
requires-python = ">=3.9"
keywords = [
    "discovery significance",
    "Asimov data set",
    "higher-order asymptotics",
    "Poisson counting experiment",
    "particle physics",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = ["numpy", "scipy", "PyYAML"]

[project.optional-dependencies]
dev = ["matplotlib", "mypy<2", "pytest", "ruff"]

[project.urls]
Repository = "https://github.com/EnzoCanonero/count-significance"
Issues = "https://github.com/EnzoCanonero/count-significance/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
count_significance = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.9"
files = ["src/count_significance"]
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]
