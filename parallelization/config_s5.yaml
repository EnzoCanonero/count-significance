# Per-signal job config: s_true = 5  (max Asimov Z ~ 5.4 over the grid)
# max_toys=1e7 -> Z ceiling ~5.2 sigma; covers essentially the whole curve.
s_vec: [5.0]
tauVec: [0.5, 2.0]
relSigVec: [0.25, 1.0]

b_min_tau: 0.1
b_max_tau: 100.0
n_bpts_tau: 50
b_min_sig: 0.1
b_max_sig: 100.0
n_bpts_sig: 50

sigrel_Z: 0.02
min_toys: 1000
max_toys: 10000000     # ceiling isf(1e-7) ~ 5.20 sigma

# n_outer total = outer_per_job * (queue in pval_s5.sub) = 5 * 400 = 2000
# ~5 * ~190 s ~ 16 min / job (n_bpts=50)
outer_per_job: 5
outer_seed: 20000
inner_seed: 120000

outdir: "output_s5"
