# Global scan configuration

s_vec: [1.0, 2.0, 5.0]
tauVec: [0.5, 1.0, 2.0]
relSigVec: [0.2, 0.5, 1.0]   # relative background uncertainty sigma_b / b

# b-range for fixed-τ scans
b_min_tau: 0.1
b_max_tau: 100.0
n_bpts_tau: 30

# b-range for fixed-σ_rel scans
b_min_sig: 0.1
b_max_sig: 100.0
n_bpts_sig: 30

# Target relative precision on Z in the inner dynamic-toy p-value
sigrel_Z: 0.01

# Inner toy ranges
min_toys: 1000
max_toys: 10000000

# RNG seeds (you can tune)
outer_seed: 12345
inner_seed: 67890

# Which MC curves to include (options: median, mean; empty list = none)
mc_statistics: [median, mean]
# Which Asimov curves to include (options: r, rstar; empty list = none)
asimov_statistics: [r, rstar]

# Output folder for per-job JSONs and plots
outdir: "output"
out_summary_pdf: "onoff_medsig.pdf"
# Combined per-signal panels (one PDF per s_true), {s} is replaced by the signal value
out_combined_tau_template: "output/onoff_medsig_combined_tau_s{s}.pdf"
out_combined_sigrel_template: "output/onoff_medsig_combined_sigrel_s{s}.pdf"
individual_plots: False
