# Global scan configuration

s_vec: [1.0, 2.0, 5.0]
tauVec: [0.5, 1.0, 2.0]
relSigVec: [0.2, 0.5, 1.0]   # relative background uncertainty sigma_b / b

# b-range for fixed-τ scans
b_min_tau: 0.1
b_max_tau: 100.0
n_bpts_tau: 30

# b-range for fixed-σ_rel scans
b_min_sig: 0.1
b_max_sig: 100.0
n_bpts_sig: 30

# Target relative precision on Z in the inner dynamic-toy p-value
sigrel_Z: 0.01

# Minimum number of inner toys and computational cap
min_toys: 1000
max_toys: 10000000

# RNG seeds (you can tune)
outer_seed: 12345
inner_seed: 67890

# Figure selection
statistics: [r, rstar]
mc_summaries: [median, mean]

# Output folder for per-job JSONs and plots
outdir: "output"
# Combined per-signal panels (one PDF per s_true), {s} is replaced by the signal value
out_tau_template: "output/onoff_asimov_tau_s{s}.pdf"
out_rel_sig_template: "output/onoff_asimov_sigrel_s{s}.pdf"
out_grid_pdf: "output/uncertain_background_asimov_grid.pdf"
