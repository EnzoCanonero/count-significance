# Merge + plot config: aggregate the three per-signal runs and render the
# paper figures. Run AFTER all jobs finish:
#   python3 collect_results.py config_merge.yaml
#
# Records are keyed by s_true, so the single-s runs below combine into s_vec.
s_vec: [2.0, 5.0, 10.0]
tauVec: [0.5, 2.0]
relSigVec: [0.25, 1.0]

b_min_tau: 0.1
b_max_tau: 100.0
n_bpts_tau: 50
b_min_sig: 0.1
b_max_sig: 100.0
n_bpts_sig: 50

# Toy precision floor of the runs (1/max_toys = 1e-7).
max_toys: 10000000

# Sets the y-axis top to 5 sigma and hides MC markers whose median reaches this
# toy-data ceiling. The continuous approximations (Asimov q/q* and the naive
# curve) are NOT capped: they keep their true values and run off the top margin.
Z_ceiling: 5.0

continuity_correction_r: False
continuity_correction_rstar: False

mc_statistics: [median]

# Input job directories (one per signal submission).
input_dirs: ["output_s2", "output_s5", "output_s10"]

outdir: "plots_parallel"

# Primary render: q + q*  -> fig 6 / 7
asimov_statistics: [r, rstar]
out_summary_pdf: "plots_parallel/fig6_7_onoff_asimov_qstar_bundle.pdf"
out_combined_tau_template: "plots_parallel/fig6_onoff_asimov_qstar_tau_s{s}.pdf"
out_combined_sigrel_template: "plots_parallel/fig7_onoff_asimov_qstar_sigrel_s{s}.pdf"
out_grid_pdf: "plots_parallel/uncertain_background_asimov_qstar_grid.pdf"

# Alternate render: q only  -> fig 2
alternate_asimov_statistics: [r]
alternate_out_summary_pdf: "plots_parallel/fig2_onoff_asimov_bundle.pdf"
alternate_out_combined_tau_template: "plots_parallel/fig2_onoff_asimov_tau_s{s}.pdf"
alternate_out_combined_sigrel_template: "plots_parallel/fig2_onoff_asimov_sigrel_s{s}.pdf"
alternate_out_grid_pdf: "plots_parallel/uncertain_background_asimov_grid.pdf"

individual_plots: False
