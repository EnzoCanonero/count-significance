# Merge + plot config: aggregate the three per-signal runs and render the
# paper figures. Run AFTER all jobs finish:
#   python3 collect_results.py config_merge.yaml
#
# Records are keyed by s_true, so the single-s runs below combine into s_vec.
s_vec: [2.0, 5.0, 10.0]
tauVec: [0.5, 2.0]
relSigVec: [0.25, 1.0]

b_min_tau: 0.1
b_max_tau: 100.0
n_bpts_tau: 50
b_min_sig: 0.1
b_max_sig: 100.0
n_bpts_sig: 50

# Graphical cutoff only: set the y-axis maximum to 5 sigma and hide MC markers
# at or above it. Stored results and continuous approximations are unchanged.
Z_display_max: 5.0

# Figure selection
statistics: [r, rstar]
mc_summaries: [median]

# Input job directories (one per signal submission).
input_dirs: ["output_s2", "output_s5", "output_s10"]

# Output
outdir: "plots_parallel"
out_tau_template: "plots_parallel/onoff_asimov_tau_s{s}.pdf"
out_rel_sig_template: "plots_parallel/onoff_asimov_sigrel_s{s}.pdf"
out_grid_pdf: "plots_parallel/uncertain_background_asimov_grid.pdf"
