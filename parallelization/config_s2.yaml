# Per-signal job config: s_true = 2  (max Asimov Z ~ 2.9 over the grid)
# max_toys=1e4 -> Z ceiling ~3.7 sigma, more than enough; very cheap.
s_vec: [2.0]
tauVec: [0.5, 2.0]
relSigVec: [0.25, 1.0]

b_min_tau: 0.1
b_max_tau: 100.0
n_bpts_tau: 50
b_min_sig: 0.1
b_max_sig: 100.0
n_bpts_sig: 50

sigrel_Z: 0.02
min_toys: 1000
max_toys: 10000        # ceiling isf(1e-4) ~ 3.72 sigma

# Outer pseudo-experiments per grid point, per job.
# n_outer total = outer_per_job * (queue in pval_s2.sub) = 100 * 20 = 2000
outer_per_job: 100
outer_seed: 10000
inner_seed: 110000

outdir: "output_s2"
