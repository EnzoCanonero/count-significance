# Signal strengths to scan (true signal)
s_vec: [1.0, 2.0, 5.0]

# Fixed tau values and relative sigma values (sigma_b / b)
tauVec: [0.5, 1.0, 2.0]
relSigVec: [0.2, 0.5, 1.0]

# b-range for fixed-τ scans
b_min_tau: 0.1
b_max_tau: 100.0
n_bpts_tau: 30

# b-range for fixed-σ_rel scans
b_min_sig: 0.1
b_max_sig: 100.0
n_bpts_sig: 30

# Toy controls
sigrel_Z: 0.05
min_toys: 500
max_toys: 100000

# Continuity correction switches for asymptotic approximations
# Disabled for on/off by default: raw r* performs better against the reference.
continuity_correction_r: False
continuity_correction_rstar: False

# Outer pseudo-experiments (median Z estimation)
n_outer: 300          # set to 1000 to mirror Condor
outer_seed: 12345
inner_seed: 67890

# Which MC curves to include (options: median, mean; empty list = none)
mc_statistics: [median, mean]
# Which Asimov curves to include (options: r, rstar; empty list = none)
asimov_statistics: [r, rstar]

# Output
outdir: "plots"
out_summary_pdf: "plots/onoff_medsig.pdf"
individual_plots: False
