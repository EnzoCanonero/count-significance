# Signal strengths to scan (true signal)
s_vec: [0.5, 0.6, 0.8, 1.0, 2.0, 5.0, 10.0]

# Background scan range (log-spaced)
b_min: 0.1
b_max: 100.0
n_bpts: 100

# MC settings for median expected Z (simple counting)
n_outer: 10000          # outer toys to build Z distribution
seed: 12345           # RNG seed for reproducibility

# Output
out_pdf: "plots/simple_medsig.pdf"
