# Signal strengths to scan (true signal)
s_vec: [0.5, 0.6, 0.8, 1.0, 2.0, 5.0, 10.0]

# Background scan range (log-spaced)
b_min: 0.1
b_max: 100.0
n_bpts: 100

# MC settings for median expected Z (simple counting)
n_outer: 10000          # outer toys to build Z distribution
seed: 12345           # RNG seed for reproducibility

# Continuity correction switches for asymptotic approximations
continuity_correction_r: False
continuity_correction_rstar: True

# Which curves to include (options: median, mean; empty list = none)
mc_statistics: [median, mean]
# Which Asimov curves to include (options: r, rstar; empty list = none)
asimov_statistics: [r, rstar]

# Output
out_pdf: "plots/simple_medsig.pdf"
individual_plots: False
