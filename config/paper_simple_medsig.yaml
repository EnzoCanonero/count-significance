# Physics parameters
s_vec: [2.0, 5.0, 10.0]

# Scan
b_min: 0.1
b_max: 100.0
n_bpts: 50

# Paper calculation: outer pseudoexperiments with exact background Poisson tails.
n_outer: 1000000  # Per (s, b) point; estimates the median significance.
seed: 12345

# Statistical options
continuity_correction_r: false
continuity_correction_rstar: true

# Figure selection
statistics: [r, rstar]
mc_summaries: [median]

# Output
out_pdf: "plots/simple_asimov.pdf"
