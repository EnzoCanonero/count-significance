# Physics parameters
s_vec: [2.0, 5.0, 10.0]
tau_vec: [0.5, 2.0]
# Relative background uncertainty, sigma_b / b
rel_sig_vec: [0.25, 1.0]

# Scan
b_min: 0.1
b_max: 100.0

# Paper calculation: outer pseudoexperiments with deterministic profiled null tails.
local:
  n_bpts: 50
  n_outer: 1000000  # Per (s, b, tau) point; estimates the median significance.
  seed: 12345

  reference_method: profile_sum
  reference_tail_mass: 1.0e-12  # Omitted probability per Poisson support.

  # MC alternative: replace reference_method above and uncomment:
  # reference_method: mc
  # mc_sigrel_Z: 0.10
  # min_toys: 500
  # max_toys: 50000

# Batch Monte Carlo settings
# Alternative Condor workflow using inner Monte Carlo toys.
# Settings retained from the earlier campaign; current paper plots use local above.
batch_mc:
  n_bpts: 50
  n_outer: 2000
  mc_sigrel_Z: 0.02
  min_toys: 1000
  signal_jobs:
    - s_true: 2.0
      n_jobs: 20
      outer_per_job: 100
      max_toys: 10000
      outer_seed: 10000
      inner_seed: 110000
    - s_true: 5.0
      n_jobs: 400
      outer_per_job: 5
      max_toys: 10000000
      outer_seed: 20000
      inner_seed: 120000
    - s_true: 10.0
      n_jobs: 400
      outer_per_job: 5
      max_toys: 10000000
      outer_seed: 30000
      inner_seed: 130000

# Display
# Upper y-axis limit only; all curve and MC values are retained.
Z_display_max: 5.0

# Figure selection
statistics: [r, rstar]
mc_summaries: [median]

# Output
out_grid_pdf: "plots/uncertain_background_asimov_grid.pdf"
out_tau_template: "plots/onoff_asimov_tau_s{s}.pdf"
out_rel_sig_template: "plots/onoff_asimov_sigrel_s{s}.pdf"
