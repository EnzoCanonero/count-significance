# Physics parameters
s_vec: [2.0, 5.0, 10.0]
tau_vec: [0.5, 2.0]
rel_sig_vec: [0.25, 1.0]

# Scan
b_min: 0.1
b_max: 100.0
n_bpts: 30

# Monte Carlo settings
# These limits are intended for a local terminal run, not batch-production precision.
n_outer: 100
mc_sigrel_Z: 0.10
min_toys: 500
max_toys: 50000
seed: 12345

# Display
# Graphical only: continuous curves retain their values and higher MC markers are hidden.
Z_display_max: 5.0

# Figure selection
statistics: [r, rstar]
mc_summaries: [median]

# Output
out_grid_pdf: "plots/uncertain_background_asimov_grid.pdf"
out_tau_template: "plots/onoff_asimov_tau_s{s}.pdf"
out_rel_sig_template: "plots/onoff_asimov_sigrel_s{s}.pdf"
